name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    name: Rust Quality & Test Suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --all-features

      - name: Build Release Binary
        run: cargo build --release --bin vacua

  swift-check:
    name: Swift Intelligence Module
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift Module
        run: |
          cd apple/VacuaIntelligence
          swift build

      - name: Run Swift Self-Tests
        run: |
          cd apple/VacuaIntelligence
          .build/debug/vacua-intelligence test
