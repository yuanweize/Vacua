name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    name: Rust Quality & Test Suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --all-features

      - name: Dependency Boundary Check (vacua-mcp MUST NOT link vacua-executor)
        run: |
          if cargo tree -p vacua-mcp | grep -q "vacua-executor"; then
            echo "ERROR: vacua-mcp links vacua-executor! Capability isolation invariant violated."
            exit 1
          fi
          echo "Dependency boundary verified: vacua-mcp has no linkage to vacua-executor."

      - name: Build Release Binaries
        run: cargo build --release --bin vacua --bin vacua-mcp

      - name: MCP Server Self-Test
        run: ./target/release/vacua-mcp --self-test

  swift-check:
    name: Swift Intelligence Modules
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FoundationModels Compile Proof (Fails if SDK Lacks API)
        run: |
          cd apple/VacuaIntelligence
          swift run foundation-models-proof

      - name: Build Swift Module
        run: |
          cd apple/VacuaIntelligence
          swift build

      - name: Verify Capabilities
        run: |
          cd apple/VacuaIntelligence
          swift run vacua-intelligence capabilities

      - name: Run Swift Self-Tests
        run: |
          cd apple/VacuaIntelligence
          swift run vacua-intelligence test

  mcp-inspector:
    name: MCP Protocol & Inspector
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build MCP Server and Fixture Generator
        run: cargo build --bin vacua-mcp --bin inspector_fixture

      - name: Run Official MCP Inspector Protocol Verification
        run: ./scripts/test_mcp_inspector.sh ./target/debug/vacua-mcp

