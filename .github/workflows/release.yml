name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-darwin-arm64:
    name: Build & Release (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Workspace Tests
        run: cargo test --workspace --all-features

      - name: Assemble Distribution Package
        run: ./scripts/package-release.sh

      - name: Release Smoke Test Outside Repository
        run: |
          mkdir -p /tmp/vacua-ci-smoke
          tar -xzf dist/vacua-v*-aarch64-apple-darwin.tar.gz -C /tmp/vacua-ci-smoke
          SMOKE_DIR=$(ls -d /tmp/vacua-ci-smoke/vacua-v*-aarch64-apple-darwin)
          "${SMOKE_DIR}/bin/vacua" --version
          "${SMOKE_DIR}/bin/vacua" doctor
          "${SMOKE_DIR}/bin/vacua" intelligence status

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
