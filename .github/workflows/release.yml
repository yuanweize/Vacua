name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-darwin-arm64:
    name: Build & Release (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v4

      - name: Inspect Toolchain
        run: |
          xcodebuild -version 2>/dev/null || true
          swift --version

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Workspace Tests
        run: cargo test --workspace --all-features

      - name: FoundationModels Compile Proof (Release Gate)
        run: |
          cd apple/VacuaIntelligence
          swift run foundation-models-proof

      - name: Assemble Distribution Package
        run: ./scripts/package-release.sh

      - name: Release Smoke Test Outside Repository
        run: |
          mkdir -p /tmp/vacua-ci-smoke
          tar -xzf dist/vacua-v*-aarch64-apple-darwin.tar.gz -C /tmp/vacua-ci-smoke
          SMOKE_DIR=$(ls -d /tmp/vacua-ci-smoke/vacua-v*-aarch64-apple-darwin)
          "${SMOKE_DIR}/bin/vacua" --version
          "${SMOKE_DIR}/bin/vacua" doctor
          "${SMOKE_DIR}/bin/vacua" intelligence status
          CAP_JSON=$("${SMOKE_DIR}/bin/vacua-intelligence" capabilities)
          echo "Capabilities: ${CAP_JSON}"
          echo "${CAP_JSON}" | grep '"foundation_models_compiled" : true' || {
            echo "Error: FoundationModels not compiled into packaged vacua-intelligence binary!"
            exit 1
          }

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Update Homebrew Tap Formula (Automated)
        if: secrets.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          FINAL_SHA=$(cat dist/SHA256SUMS | awk '{print $1}')
          echo "Updating Homebrew tap with Version=${VERSION}, SHA=${FINAL_SHA}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/yuanweize/homebrew-tap.git" /tmp/homebrew-tap
          sed -i '' -E "s|url \".*\"|url \"https://github.com/yuanweize/vacua/releases/download/v${VERSION}/vacua-v${VERSION}-aarch64-apple-darwin.tar.gz\"|" /tmp/homebrew-tap/Formula/vacua.rb
          sed -i '' -E "s|sha256 \".*\"|sha256 \"${FINAL_SHA}\"|" /tmp/homebrew-tap/Formula/vacua.rb
          git -C /tmp/homebrew-tap config user.name "github-actions[bot]"
          git -C /tmp/homebrew-tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/homebrew-tap commit -am "chore(vacua): release v${VERSION}"
          git -C /tmp/homebrew-tap push origin main

      - name: Log Homebrew Manual Instructions (If Token Missing)
        if: secrets.HOMEBREW_TAP_TOKEN == ''
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          FINAL_SHA=$(cat dist/SHA256SUMS | awk '{print $1}')
          echo "::notice title=Manual Homebrew Tap Update Required::HOMEBREW_TAP_TOKEN secret is not set. Please update yuanweize/homebrew-tap/Formula/vacua.rb with Version=${VERSION} and SHA=${FINAL_SHA}."
