name: Bug Report
description: File a bug report for Vacua
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please do not report security vulnerabilities here. Use private reporting instead.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS Version & Architecture
      placeholder: e.g. macOS 15.4 (Apple Silicon M3 Max)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `vacua scan ...`
        2. ...
    validations:
      required: true
