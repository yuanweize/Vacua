[workspace]
members = [
    "crates/vacua-core",
    "crates/vacua-scan",
    "crates/vacua-rules",
    "crates/vacua-risk",
    "crates/vacua-plan",
    "crates/vacua-cli",
    "crates/vacua-index",
    "crates/vacua-executor",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Weize Yuan <iyuanweize@gmail.com>", "Vacua Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuanweize/vacua"
homepage = "https://github.com/yuanweize/vacua"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
sysinfo = "0.33"
tempfile = "3.17"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
libc = "0.2"
walkdir = "2.5"
thiserror = "2.0"
rusqlite = { version = "0.33", features = ["bundled"] }
