[workspace]
members = [
    "crates/reclaim-core",
    "crates/reclaim-scan",
    "crates/reclaim-rules",
    "crates/reclaim-risk",
    "crates/reclaim-plan",
    "crates/reclaim-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Project Reclaim Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/project-reclaim/reclaim"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "cargo"] }
sysinfo = "0.33"
tempfile = "3.17"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
libc = "0.2"
walkdir = "2.5"
thiserror = "2.0"
